<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Network Management</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome CDN (Working Link) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-r from-indigo-500 via-purple-600 to-pink-500 flex items-center justify-center h-screen">

    <!-- Form Container -->
    <div class="bg-white p-8 rounded-lg shadow-2xl w-96 max-w-md space-y-6">
        
        <!-- Logo or Network Icon -->
        <div class="flex justify-center mb-6">
            <i class="fas fa-network-wired text-6xl text-teal-600"></i>
        </div>

        <!-- Heading with Icon -->
        <h2 class="text-3xl font-semibold text-center text-gray-800 flex items-center justify-center">NetPulse Login
        </h2>
        <p class="text-center text-gray-600 text-sm mb-6">Access and manage your network infrastructure securely.</p>

        <!-- Login Form -->
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <!-- Email Input -->
            <div class="relative">
                <input type="email" name="email" placeholder="Email Address" class="w-full p-3 pl-10 pr-4 border-2 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-400" required>
                <i class="fas fa-envelope absolute left-3 top-3 text-gray-500"></i>
            </div>

            <!-- Password Input -->
            <div class="relative">
                <input type="password" name="password" placeholder="Password" class="w-full p-3 pl-10 pr-4 border-2 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-400" required>
                <i class="fas fa-lock absolute left-3 top-3 text-gray-500"></i>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-teal-600 text-white p-3 rounded-lg hover:bg-teal-700 transition duration-300 ease-in-out transform hover:scale-105 flex items-center justify-center">
                <i class="fas fa-sign-in-alt mr-2"></i> Login
            </button>
        </form>

        <!-- Register Link -->
        <p class="text-center text-sm text-gray-600">Don't have an account? <a href="/register/" class="text-teal-500 hover:text-teal-600">Register</a></p>

        <!-- Footer Note (Optional) -->
        <p class="text-center text-xs text-gray-500 mt-6">© 2025 Network Manager. All Rights Reserved.</p>
    </div>
</body>
</html>
